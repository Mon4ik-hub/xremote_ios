name: AnimeGOCast

options:
  bundleIdPrefix: com.mon4ik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AnimeGOCast:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
    dependencies:
      - target: AnimeGOCastShareExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AnimeGO Cast
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Приложению нужен доступ к локальной сети, чтобы отправлять видео на AniLabX на телевизоре."
        CFBundleURLTypes:
          - CFBundleURLName: com.mon4ik.animegocast
            CFBundleURLSchemes:
              - animegocast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mon4ik.animegocast

  AnimeGOCastShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Core
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: AnimeGO Cast
        NSLocalNetworkUsageDescription: "Расширению нужен доступ к локальной сети, чтобы отправлять видео на AniLabX на телевизоре."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mon4ik.animegocast.shareextension
        SKIP_INSTALL: true

  AnimeGOCastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AnimeGOCast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mon4ik.animegocast.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AnimeGOCast.app/AnimeGOCast"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AnimeGOCast:
    build:
      targets:
        AnimeGOCast: all
        AnimeGOCastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AnimeGOCastTests
    archive:
      config: Release
